<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mosto — calcolatore di fermentazione</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
    select { cursor: pointer; }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    .layout-grid { display: grid; grid-template-columns: minmax(0, 320px) 1fr; gap: 40px; }
    @media (max-width: 768px) {
      .layout-grid { grid-template-columns: 1fr; gap: 32px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // ---------- Icons (inline SVG, no external dep) ----------

    function Icon({ d, size = 17, color }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
          stroke={color || "currentColor"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d={d} />
        </svg>
      );
    }

    function Grape(props) {
      return (
        <svg {...props} width={props.size || 17} height={props.size || 17} viewBox="0 0 24 24" fill="none"
          stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M22 5V2l-5.89 5.89" />
          <circle cx="16.6" cy="15.89" r="3" />
          <circle cx="8.11" cy="7.4" r="3" />
          <circle cx="12.35" cy="11.65" r="3" />
          <circle cx="13.91" cy="5.85" r="3" />
          <circle cx="18.15" cy="10.09" r="3" />
          <circle cx="6.56" cy="13.2" r="3" />
          <circle cx="10.8" cy="17.44" r="3" />
          <circle cx="5" cy="19" r="3" />
        </svg>
      );
    }

    function Flower(props) {
      return (
        <svg {...props} width={props.size || 17} height={props.size || 17} viewBox="0 0 24 24" fill="none"
          stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="3" />
          <path d="M12 16.5A4.5 4.5 0 1 1 7.5 12 4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 1 1 4.5 4.5 4.5 4.5 0 1 1-4.5 4.5" />
          <path d="M12 7.5V9" />
          <path d="M7.5 12H9" />
          <path d="M16.5 12H15" />
          <path d="M12 16.5V15" />
          <path d="m8 8 1.88 1.88" />
          <path d="M14.12 9.88 16 8" />
          <path d="m8 16 1.88-1.88" />
          <path d="M14.12 14.12 16 16" />
        </svg>
      );
    }

    function Apple(props) {
      return (
        <svg {...props} width={props.size || 17} height={props.size || 17} viewBox="0 0 24 24" fill="none"
          stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M12 20.94c1.5 0 2.75 1.06 4 1.06 3 0 6-8 6-12.22A4.91 4.91 0 0 0 17 5c-2.22 0-4 1.44-5 2-1-.56-2.78-2-5-2a4.9 4.9 0 0 0-5 4.78C2 14 5 22 8 22c1.25 0 2.5-1.06 4-1.06Z" />
          <path d="M10 2c1 .5 2 2 2 5" />
        </svg>
      );
    }

    function FlaskConical(props) {
      return (
        <svg {...props} width={props.size || 17} height={props.size || 17} viewBox="0 0 24 24" fill="none"
          stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2" />
          <path d="M8.5 2h7" />
          <path d="M7 16.5h10" />
        </svg>
      );
    }

    function Droplets(props) {
      return (
        <svg {...props} width={props.size || 17} height={props.size || 17} viewBox="0 0 24 24" fill="none"
          stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.84-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z" />
          <path d="M12.56 14.69c1.47 0 2.67-1.22 2.67-2.72 0-.79-.38-1.53-1.14-2.15S12.75 8.7 12.56 8c-.16.79-.7 1.53-1.46 2.15S9.89 11.97 9.89 12.97c0 1.5 1.2 2.72 2.67 2.72z" />
          <path d="M17 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S17.29 6.75 17 5.3c-.29 1.45-1.14 2.84-2.29 3.76S13 11.1 13 12.25c0 2.22 1.8 4.05 4 4.05z" />
        </svg>
      );
    }

    function Filter(props) {
      return (
        <svg {...props} width={props.size || 17} height={props.size || 17} viewBox="0 0 24 24" fill="none"
          stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" />
        </svg>
      );
    }

    function Shield(props) {
      return (
        <svg {...props} width={props.size || 17} height={props.size || 17} viewBox="0 0 24 24" fill="none"
          stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
        </svg>
      );
    }

    function AlertTriangle(props) {
      return (
        <svg {...props} width={props.size || 17} height={props.size || 17} viewBox="0 0 24 24" fill="none"
          stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" />
          <path d="M12 9v4" />
          <path d="M12 17h.01" />
        </svg>
      );
    }

    function ChevronDown({ size = 13, style }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
          stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
          style={style}>
          <path d="m6 9 6 6 6-6" />
        </svg>
      );
    }

    // ---------- Reference data ----------

    const TYPES = [
      { id: "rosso", label: "Vino rosso", icon: Grape },
      { id: "bianco", label: "Vino bianco", icon: Grape },
      { id: "idromele", label: "Idromele", icon: Flower },
      { id: "sidro", label: "Sidro di mele", icon: Apple },
    ];

    const ACCENT = {
      rosso: "#9C3B3B",
      bianco: "#C9A227",
      idromele: "#B8860B",
      sidro: "#6E8F42",
    };

    const ACCENT_SOFT = {
      rosso: "#3A2020",
      bianco: "#3A3218",
      idromele: "#38300F",
      sidro: "#26301A",
    };

    const DEFAULT_YAN = { rosso: 120, bianco: 150, idromele: 5, sidro: 40 };

    const BENTONITE_RATE = { rosso: 0.2, bianco: 0.8, idromele: 0.3, sidro: 0.6 };
    const BENTONITE_RANGE = {
      rosso: "0\u20130.5 g/L (spesso non necessario)",
      bianco: "0.5\u20131.2 g/L",
      idromele: "0\u20130.5 g/L (spesso non necessario)",
      sidro: "0.2\u20131.0 g/L",
    };

    const NUTRIENT_FACTORS = { fermaidK: 100, fermaidO: 40 };
    const ORGANIC_N_EFFICIENCY = 3;
    const NUTRIENT_LABELS = {
      fermaidK: "Fermaid-K",
      fermaidO: "Fermaid-O",
    };

    const YEASTS = [
      { name: "EC-1118", brand: "Lalvin", tol: 18, temp: "10\u201330\u00b0C", use: "tutti i tipi", nFactor: 0.75, nNeed: "basso", note: "Universale, molto resistente, neutro" },
      { name: "RC212", brand: "Lalvin", tol: 16, temp: "18\u201330\u00b0C", use: "rosso", nFactor: 0.9, nNeed: "medio", note: "Esalta frutto rosso, tannini morbidi" },
      { name: "D254", brand: "Lalvin", tol: 16, temp: "20\u201330\u00b0C", use: "rosso", nFactor: 0.9, nNeed: "medio", note: "Rossi strutturati, note speziate" },
      { name: "D47", brand: "Lalvin", tol: 14, temp: "15\u201325\u00b0C", use: "bianco, idromele, sidro", nFactor: 0.75, nNeed: "basso", note: "Corpo/note burrose sui bianchi, preserva aromi di miele sull'idromele" },
      { name: "71B", brand: "Lalvin", tol: 14, temp: "15\u201330\u00b0C", use: "bianco, idromele, sidro", nFactor: 0.75, nNeed: "basso", note: "Ammorbidisce l'acidit\u00e0 (metabolizza parte del malico), esteri fruttati" },
      { name: "Zymoferm Bayanus", brand: "Chimica Franke", tol: 18, temp: "10\u201340\u00b0C", use: "rosso, bianco, sidro", nFactor: 0.9, nNeed: "medio", note: "Poca schiuma, buono per riprese di fermentazione bloccata" },
    ];

    const MOLECULAR_SO2 = { rosso: 0.5, bianco: 0.8, idromele: 0.8, sidro: 0.8 };

    // ---------- Calculation functions ----------

    function potentialABV(og) {
      return Math.max((og - 1) * 131.25, 0);
    }

    function yeastRate(og) {
      if (og < 1.08) return 0.2;
      if (og < 1.1) return 0.25;
      if (og < 1.12) return 0.3;
      return 0.35;
    }

    function yanTargetFromBrix(brix, sg, y) {
      return (y * 10 * brix * sg) / 0.9982;
    }

    function so2Target(pH, molecular) {
      const c = Math.min(Math.max(pH, 2.6), 4.5);
      return molecular * (1 + Math.pow(10, c - 1.81));
    }

    function sgToBrix(sg) {
      return ((182.4601 * sg - 775.6821) * sg + 1262.7794) * sg - 669.5622;
    }

    function tosnaFermaidO(brix, nFactor, litres) {
      return (brix * 10 * nFactor / 50) * (litres / 3.78541);
    }

    function numOrEmpty(v) {
      return v === "" ? "" : Number(v);
    }

    // ---------- UI helpers ----------

    function Field({ label, hint, children }) {
      return (
        <label style={{ display: "block", marginBottom: 16 }}>
          <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 6 }}>
            <span style={{ fontSize: 14, letterSpacing: "-0.01em", color: "#C9C2B4" }}>{label}</span>
            {hint && <span style={{ fontSize: 12, color: "#726A5C" }}>{hint}</span>}
          </div>
          {children}
        </label>
      );
    }

    const inputBase = {
      width: "100%",
      padding: "8px 12px",
      fontFamily: "'SF Mono', 'Fira Code', monospace",
      fontSize: 15,
      outline: "none",
      background: "#151310",
      border: "1px solid #3A352C",
      color: "#EDE6D6",
      transition: "border-color .15s",
    };

    function NumInput(props) {
      return <input {...props} type="number" style={inputBase} />;
    }

    function Select({ value, onChange, children }) {
      return (
        <div style={{ position: "relative" }}>
          <select value={value} onChange={onChange} style={{
            ...inputBase,
            appearance: "none",
            paddingRight: 36,
            cursor: "pointer",
          }}>
            {children}
          </select>
          <ChevronDown size={16} style={{
            position: "absolute", right: 12, top: "50%", transform: "translateY(-50%)",
            pointerEvents: "none", color: "#726A5C",
          }} />
        </div>
      );
    }

    function Section({ icon: Icon, title, accent, children }) {
      return (
        <div style={{ paddingTop: 20, borderTop: `2px solid ${accent}` }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
            <Icon size={17} color={accent} />
            <h3 style={{ fontSize: 15, letterSpacing: "-0.01em", color: "#EDE6D6" }}>{title}</h3>
          </div>
          {children}
        </div>
      );
    }

    function Num({ children, unit }) {
      return (
        <span style={{ fontFamily: "'SF Mono', 'Fira Code', monospace", fontSize: 24, color: "#EDE6D6" }}>
          {children}
          {unit && <span style={{ fontSize: 14, marginLeft: 4, color: "#9C9184" }}>{unit}</span>}
        </span>
      );
    }

    // ---------- Main component ----------

    function FermentationCalculator() {
      const [type, setType] = useState("rosso");
      const [volume, setVolume] = useState(20);
      const [og, setOg] = useState(1.09);
      const [ph, setPh] = useState(3.4);
      const [strainIndex, setStrainIndex] = useState(0);
      const [nutrientProduct, setNutrientProduct] = useState("fermaidK");
      const [nOverride, setNOverride] = useState({ fermaidK: "", fermaidO: "" });
      const [effOverride, setEffOverride] = useState("");
      const [mustYanInput, setMustYanInput] = useState("");
      const [currentSO2, setCurrentSO2] = useState(0);

      const accent = ACCENT[type];
      const accentSoft = ACCENT_SOFT[type];
      const strains = YEASTS;
      const strain = strains[strainIndex];

      const abv = potentialABV(og);
      const rate = yeastRate(og);
      const yeastG = rate * volume;
      const rehydWaterMl = yeastG * 10;

      const mustYan = mustYanInput === "" ? DEFAULT_YAN[type] : Number(mustYanInput);
      const brix = sgToBrix(og);
      const isMeadTosna = type === "idromele" && nutrientProduct === "fermaidO";
      const target = yanTargetFromBrix(brix, og, strain.nFactor);
      const deficit = Math.max(target - mustYan, 0);
      const factor = nOverride[nutrientProduct] === "" ? NUTRIENT_FACTORS[nutrientProduct] : Number(nOverride[nutrientProduct]);
      const organicEff = nutrientProduct === "fermaidO" && !isMeadTosna
        ? (effOverride === "" ? ORGANIC_N_EFFICIENCY : Number(effOverride))
        : 1;
      const totalNutrientG = Math.max(
        isMeadTosna
          ? tosnaFermaidO(brix, strain.nFactor, volume)
          : (deficit * volume) / (factor * organicEff),
        0
      );

      const bentoniteG = BENTONITE_RATE[type] * volume;

      const phNum = ph === "" ? 0 : ph;
      const so2Ppm = so2Target(phNum, MOLECULAR_SO2[type]);
      const so2NeededPpm = Math.max(so2Ppm - Number(currentSO2 || 0), 0);
      const kmbsG = (so2NeededPpm * volume) / 576;

      const tolExceeded = abv > strain.tol;

      function selectType(id) {
        setType(id);
        setStrainIndex(0);
      }

      return (
        <div style={{ width: "100%", minHeight: "100vh", background: "#181613", color: "#EDE6D6" }}>
          <div style={{ maxWidth: 960, margin: "0 auto", padding: "40px 20px" }}>
            {/* Header */}
            <div style={{ marginBottom: 32 }}>
              <h1 style={{ fontSize: 34, letterSpacing: "-0.02em" }}>Mosto</h1>
              <p style={{ fontSize: 15, marginTop: 6, color: "#9C9184", maxWidth: 560 }}>
                Calcolatore di fermentazione &middot; lievito, nutrienti, bentonite e metabisolfito &middot;
                dosi di partenza per il tuo impianto.
              </p>
            </div>

            {/* Type switch */}
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 32 }}>
              {TYPES.map((t) => {
                const active = t.id === type;
                const Icon = t.icon;
                return (
                  <button key={t.id} onClick={() => selectType(t.id)}
                    style={{
                      display: "flex", alignItems: "center", gap: 8,
                      padding: "8px 14px", fontSize: 14, cursor: "pointer",
                      background: active ? ACCENT_SOFT[t.id] : "transparent",
                      border: `1px solid ${active ? ACCENT[t.id] : "#3A352C"}`,
                      color: active ? "#EDE6D6" : "#9C9184",
                      transition: "all .15s",
                    }}>
                    <Icon size={15} color={active ? ACCENT[t.id] : "#726A5C"} />
                    {t.label}
                  </button>
                );
              })}
            </div>

            <div className="layout-grid">
              {/* Input panel */}
              <div>
                <Field label="Volume mosto" hint="litri">
                  <NumInput value={volume} min={1} step={1}
                    onChange={(e) => setVolume(numOrEmpty(e.target.value))} />
                </Field>

                <Field label="Gravità iniziale (densimetro)" hint="es. 1.090">
                  <NumInput value={og} min={0.98} max={1.2} step={0.001}
                    onChange={(e) => setOg(numOrEmpty(e.target.value))} />
                </Field>

                <Field label="pH mosto">
                  <NumInput value={ph} min={2.6} max={4.5} step={0.1}
                    onChange={(e) => setPh(numOrEmpty(e.target.value))} />
                </Field>

                <Field label="Ceppo di lievito">
                  <Select value={strainIndex} onChange={(e) => setStrainIndex(Number(e.target.value))}>
                    {strains.map((s, i) => (
                      <option key={s.name} value={i}>{s.name} ({s.brand}) - max {s.tol}% vol</option>
                    ))}
                  </Select>
                </Field>
                <div style={{ display: "flex", flexDirection: "column", gap: 2, fontSize: 12, marginTop: -8, marginBottom: 16, color: "#726A5C" }}>
                  <span>{strain.note}</span>
                  <span>Uso tipico: {strain.use}</span>
                  <span>Temperatura: {strain.temp}</span>
                  <span>Fabbisogno azoto: {strain.nNeed}</span>
                </div>

                {tolExceeded && (
                  <div style={{
                    display: "flex", gap: 8, padding: "10px 12px", fontSize: 12, marginBottom: 16,
                    background: "#3A2020", border: "1px solid #7A3535", color: "#E8C4C4",
                  }}>
                    <AlertTriangle size={15} style={{ flexShrink: 0, marginTop: 2 }} />
                    <span>
                      Il ceppo scelto tollera fino a {strain.tol}% vol, il mosto ne richiede{" "}
                      {abv.toFixed(1)}%. Rischio di arresto di fermentazione: scegline uno più
                      resistente o riduci la gravità.
                    </span>
                  </div>
                )}

                <div style={{ paddingTop: 4, paddingBottom: 8 }}>
                    <Field label="Prodotto azotato">
                      <Select value={nutrientProduct}
                        onChange={(e) => setNutrientProduct(e.target.value)}>
                        <option value="fermaidK">Fermaid-K</option>
                        <option value="fermaidO">Fermaid-O</option>
                      </Select>
                    </Field>

                    <Field label="Azoto nel prodotto" hint={`mg N per g - default ${NUTRIENT_FACTORS[nutrientProduct]}`}>
                      <NumInput value={nOverride[nutrientProduct]} placeholder={String(NUTRIENT_FACTORS[nutrientProduct])}
                        min={0} step={5}
                        onChange={(e) => setNOverride({ ...nOverride, [nutrientProduct]: e.target.value })} />
                    </Field>

                    {nutrientProduct === "fermaidO" && !isMeadTosna && (
                      <Field label="Efficienza N organico" hint={`x - default ${ORGANIC_N_EFFICIENCY}`}>
                        <NumInput value={effOverride} placeholder={String(ORGANIC_N_EFFICIENCY)}
                          min={1} step={0.5}
                          onChange={(e) => setEffOverride(e.target.value)} />
                      </Field>
                    )}

                    <Field label="YAN già presente nel mosto" hint={`mg N/L - default ${DEFAULT_YAN[type]}`}>
                      <NumInput value={mustYanInput} placeholder={String(DEFAULT_YAN[type])}
                        min={0} step={5}
                        onChange={(e) => setMustYanInput(e.target.value)} />
                    </Field>

                    <Field label="SO2 libera già presente" hint="ppm, se misurata">
                      <NumInput value={currentSO2} min={0} step={1}
                        onChange={(e) => setCurrentSO2(numOrEmpty(e.target.value))} />
                    </Field>
                  </div>
              </div>

              {/* Results panel */}
              <div>
                <div style={{
                  padding: "12px 16px", fontSize: 14,
                  fontFamily: "'SF Mono', 'Fira Code', monospace",
                  display: "flex", flexWrap: "wrap", gap: "4px 24px",
                  background: accentSoft, color: "#EDE6D6", marginBottom: 28,
                }}>
                  <span>{volume} L</span>
                  <span>ABV potenziale ≈ {abv.toFixed(1)}%</span>
                  {isMeadTosna
                    ? <span>Brix ≈ {brix.toFixed(1)}</span>
                    : <span>target YAN {target.toFixed(0)} mg/L</span>}
                </div>

                <div style={{ display: "flex", flexDirection: "column", gap: 28 }}>
                  <Section icon={Droplets} title="Lievito" accent={accent}>
                    <div style={{ display: "flex", flexWrap: "wrap", alignItems: "flex-end", gap: "12px 32px", marginBottom: 8 }}>
                      <div>
                        <Num unit="g">{yeastG.toFixed(1)}</Num>
                        <div style={{ fontSize: 12, marginTop: 2, color: "#9C9184" }}>
                          dose lievito ({rate} g/L)
                        </div>
                      </div>
                      <div>
                        <Num unit="mL">{rehydWaterMl.toFixed(0)}</Num>
                        <div style={{ fontSize: 12, marginTop: 2, color: "#9C9184" }}>
                          acqua di reidratazione (35–40°C)
                        </div>
                      </div>
                      <div>
                        <Num unit="g">{totalNutrientG.toFixed(2)}</Num>
                        <div style={{ fontSize: 12, marginTop: 2, color: "#9C9184" }}>
                          {isMeadTosna
                            ? "Fermaid-O totale (TOSNA, 4 dosi)"
                            : `${NUTRIENT_LABELS[nutrientProduct]} in un'unica aggiunta`}
                        </div>
                      </div>
                    </div>
                    <p style={{ fontSize: 12, color: "#726A5C" }}>
                      Reidrata 15–20 min, poi avvicina la temperatura del composto a quella del mosto
                      (max 10°C di differenza) prima di inoculare.
                    </p>
                    <p style={{ fontSize: 12, marginTop: 8, fontFamily: "'SF Mono', 'Fira Code', monospace", color: "#9C9184" }}>
                      {isMeadTosna
                        ? `TOSNA · Brix ${brix.toFixed(1)} · fattore azoto lievito ${strain.nFactor}`
                        : `YAN mosto ${mustYan} mg/L · deficit ${deficit.toFixed(0)} mg/L · ${NUTRIENT_LABELS[nutrientProduct]}${organicEff > 1 ? ` · efficienza azoto organico x${organicEff}` : ""}`}
                    </p>
                  </Section>

                  <Section icon={Filter} title="Bentonite" accent={accent}>
                    <div style={{ marginBottom: 8 }}>
                      <Num unit="g">{bentoniteG.toFixed(1)}</Num>
                      <div style={{ fontSize: 12, marginTop: 2, color: "#9C9184" }}>
                        range tipico per {TYPES.find((t) => t.id === type).label.toLowerCase()}:{" "}
                        {BENTONITE_RANGE[type]}
                      </div>
                    </div>
                    <p style={{ fontSize: 12, color: "#726A5C" }}>
                      Idrata in 10 parti d'acqua calda almeno 24h prima, mescolando bene fino a
                      sospensione omogenea.
                    </p>
                  </Section>

                  <Section icon={Shield} title="Metabisolfito di potassio" accent={accent}>
                    <div style={{ display: "flex", flexWrap: "wrap", alignItems: "flex-end", gap: "12px 32px", marginBottom: 8 }}>
                      <div>
                        <Num unit="g">{kmbsG.toFixed(2)}</Num>
                        <div style={{ fontSize: 12, marginTop: 2, color: "#9C9184" }}>KMBS da aggiungere</div>
                      </div>
                      <div>
                        <Num unit="ppm">{so2Ppm.toFixed(0)}</Num>
                        <div style={{ fontSize: 12, marginTop: 2, color: "#9C9184" }}>
                          target SO2 libera a pH {phNum.toFixed(1)} · {MOLECULAR_SO2[type]} ppm molecolare
                        </div>
                      </div>
                    </div>
                    <p style={{ fontSize: 12, color: "#726A5C" }}>
                      Formula: ppm desiderati × litri ÷ 576. Il target libero deriva da{" "}
                      {MOLECULAR_SO2[type]} ppm di SO2 molecolare (la forma attiva): ppm molecolare ×
                      (1 + 10^(pH−1.81)). A pH più alto serve più SO2 totale per la stessa protezione,
                      perché la frazione molecolare attiva scende.
                    </p>
                    {so2Ppm > 50 && (
                      <p style={{ fontSize: 12, marginTop: 8, color: "#E8C4C4" }}>
                        Oltre ~50 ppm di SO2 libera il dosaggio diventa percepibile al naso e
                        sconsigliato: valuta di abbassare il pH (es. con acido tartarico) invece di
                        aggiungere altro metabisolfito.
                      </p>
                    )}
                  </Section>

                  <p style={{ fontSize: 12, paddingTop: 8, color: "#54503F" }}>
                    Valori di riferimento per uso amatoriale, non sostituiscono un'analisi di
                    laboratorio (YAN e SO2 reali possono differire da questi default).
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ---------- Render ----------

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<FermentationCalculator />);
  </script>
</body>
</html>
